<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop Sneakers — VAULT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="shop">
    <header class="site-header">
      <div class="container header-inner">
        <a class="logo" href="index.html">VAULT<span>.</span></a>
        <nav class="site-nav" aria-label="Primary">
          <a href="index.html">Home</a>
          <a href="products.html" class="is-active">Shop</a>
          <a href="cart.html">Cart</a>
          <a href="payment.html">Payment</a>
        </nav>
        <button class="nav-toggle" type="button" aria-label="Toggle menu" aria-expanded="false">☰</button>
        <div class="header-actions">
          <a class="cart-link" href="cart.html">
            Bag
            <span class="cart-count" data-cart-count hidden>0</span>
          </a>
        </div>
      </div>
    </header>

    <main class="container">
      <section class="page-hero">
        <p class="kicker">Catalog</p>
        <h1>ALL SNEAKERS</h1>
        <p class="lede">Browse the wall and filter by category or price.</p>
      </section>

      <div class="toolbar">
        <input id="search" type="search" placeholder="Search Apex, Dunk, Knit..." />
        <select id="category">
          <option value="all">All categories</option>
          <option value="Running">Running</option>
          <option value="Basketball">Basketball</option>
          <option value="Lifestyle">Lifestyle</option>
          <option value="Limited">Limited</option>
        </select>
        <select id="sort">
          <option value="featured">Featured</option>
          <option value="price-asc">Price: low to high</option>
          <option value="price-desc">Price: high to low</option>
          <option value="name">Name A–Z</option>
        </select>
      </div>

      <p class="category-tag" id="result-count"></p>
      <div class="product-grid" id="product-grid"></div>
    </main>

    <footer class="site-footer">
      <div class="container">
        <div class="logo">VAULT<span>.</span></div>
        <p class="copyright">© 2026 VAULT Sneaker Co.</p>
      </div>
    </footer>

    <div class="toast" id="toast" role="status"></div>
    <script src="js/data.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/products.js"></script>
  </body>
</html>
